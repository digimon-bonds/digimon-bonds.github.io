<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imagens locais • Battle Scene</title><style>body{background:#091720;color:#e6eff4;font:15px Arial;margin:30px}a{color:#ffd084}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}article{padding:18px;background:#17323d;border:1px solid #42606e;border-radius:16px}img{width:100%;height:220px;object-fit:contain;background:repeating-conic-gradient(#d9dfe3 0 25%,#fff 0 50%) 0/18px 18px;border-radius:9px}small{overflow-wrap:anywhere;display:block;margin:8px 0;color:#bad0da}</style><h1>Imagens locais do Battle Scene</h1><p>Rookie iniciais com parceiros humanos no Digibank e Alphamon como asset interno. O quadriculado mostra o fundo transparente. Clique na imagem para abrir o PNG.</p><p><a href="/">Voltar à batalha</a></p><main id="gallery"></main><script type="module">import {sheetArt} from './sheet-art.mjs';const arts=[...sheetArt,{name:'Alphamon',partner:'Asset interno',image:'assets/alphamon.png'}];for(const art of arts){const card=document.createElement('article'),a=document.createElement('a'),img=document.createElement('img'),h=document.createElement('h2'),path=document.createElement('small');h.textContent=art.name;img.src=art.image;img.alt=art.name;a.href=art.image;a.target='_blank';a.append(img);path.textContent=art.partner+' · '+art.image;card.append(a,h,path);if(art.source){const source=document.createElement('a');source.href=art.source.startsWith('./')?'/creator/'+art.source.slice(2):art.source;source.textContent='Imagem cadastrada no Digibank';card.append(source);}document.querySelector('main').append(card);}</script></html>
