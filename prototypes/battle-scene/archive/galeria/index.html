<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeria de Digimon • Battle Link</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#091720;color:#e6eff4;font:15px Arial,sans-serif;margin:0;padding:32px;line-height:1.5}header,.toolbar,#coverage,main{max-width:1380px;margin:0 auto}header{padding-bottom:24px}h1{margin:12px 0;font-size:clamp(26px,4vw,38px)}a{color:#7ee8ed;text-underline-offset:4px}.eyebrow{color:#74dbe2;letter-spacing:3px;font:11px monospace}.toolbar{display:flex;gap:16px;align-items:end;padding:20px;border:1px solid #315c6a;border-radius:12px;background:#102731}.toolbar label{display:grid;gap:6px;flex:1;font-size:12px;color:#b4d5de}.toolbar label:last-of-type{flex:0 1 240px}input,select{width:100%;min-height:44px;border:1px solid #426d7a;border-radius:7px;background:#091b24;color:#e6eff4;padding:10px;font:15px Arial}input:focus,select:focus{outline:2px solid #79e3da;outline-offset:2px}#artCount{margin:0;white-space:nowrap;color:#9debd8;font:12px monospace}#coverage{padding:16px 0;color:#b4cbd5;font-size:13px}#coverage details{margin-top:8px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;padding-bottom:32px}article{padding:14px;background:linear-gradient(145deg,#173540,#0d202a);border:1px solid #315c6a;border-radius:12px;box-shadow:inset 0 2px #4da7b43d}img{width:100%;height:220px;object-fit:contain;background:repeating-conic-gradient(#d9dfe3 0 25%,#fff 0 50%) 0/18px 18px;border-radius:7px}h2{font-size:17px;margin:12px 0 4px}small{display:block;margin:4px 0 10px;color:#adc6d1}.source{font-size:12px}.stage{display:inline-block;border:1px solid #367889;border-radius:4px;padding:2px 7px;color:#9aebed;font:10px monospace;text-transform:uppercase}.stage.champion{color:#ffce80;border-color:#8d6935}@media(max-width:600px){body{padding:18px}.toolbar{flex-wrap:wrap}.toolbar label,.toolbar label:last-of-type{flex:1 1 100%}main{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}article{padding:9px}img{height:160px}}
</style>
<header><a href="../../scenes.html">← Battle Link</a><p class="eyebrow">DIGIBANK // ART GALLERY</p><h1>Galeria de Digimon</h1><p>Recortes das imagens cadastradas no Digibank do site. O quadriculado indica transparência. Clique na arte para abrir o PNG.</p></header>
<section class="toolbar" aria-label="Filtros da galeria"><label>Buscar Digimon<input id="artSearch" type="search" placeholder="Nome do Digimon"></label><label>Estágio<select id="artStage"><option value="">Todos</option><option value="rookie">Rookie / Novato</option><option value="champion">Champion / Campeão</option><option value="internal">Asset interno</option></select></label><p id="artCount" role="status"></p></section>
<aside id="coverage"></aside><main id="gallery"></main>
<script type="module">
import {sheetArt} from '../../sheet-art.mjs';
const arts=[...sheetArt,{name:'Alphamon',partner:'Asset interno',stage:'internal',image:'assets/alphamon.png'}];
const key=value=>value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const labels={rookie:'Rookie',champion:'Champion',internal:'Asset interno'};
function renderGallery(){
 const term=key(document.querySelector('#artSearch').value),stage=document.querySelector('#artStage').value;
 const selected=arts.filter(art=>key(art.name).includes(term)&&(!stage||art.stage===stage));
 document.querySelector('main').replaceChildren();document.querySelector('#artCount').textContent=selected.length+' de '+arts.length+' imagens';
 for(const art of selected){
  const card=document.createElement('article'),a=document.createElement('a'),img=document.createElement('img'),h=document.createElement('h2'),description=document.createElement('small'),tag=document.createElement('span');
  h.textContent=art.name;const imageURL=new URL('../../'+art.image,location.href).href;img.src=imageURL;img.alt=art.name;img.loading='lazy';a.href=imageURL;a.target='_blank';a.rel='noopener';a.append(img);description.textContent=art.partner||'Digibank do site';tag.textContent=labels[art.stage]||art.stage;tag.className='stage '+art.stage;card.append(a,h,tag,description);
  if(art.source){const source=document.createElement('a');source.href=art.source.startsWith('./')?'/creator/'+art.source.slice(2):art.source;source.textContent='Arte original do Digibank';source.className='source';source.target='_blank';source.rel='noopener';card.append(source);}document.querySelector('main').append(card);
 }
}
document.querySelector('#artSearch').addEventListener('input',renderGallery);document.querySelector('#artStage').addEventListener('change',renderGallery);renderGallery();
try{
 const response=await fetch('../../assets/partners/cutout-generation.json');if(!response.ok)throw Error('Coverage unavailable');const record=await response.json();
 const coverage=document.querySelector('#coverage');coverage.textContent=Object.entries(record.stages).map(([stage,stats])=>labels[stage]+': '+stats.completed+' de '+stats.total+' recortes').join(' · ');
 if(record.pending.length){const details=document.createElement('details'),summary=document.createElement('summary'),p=document.createElement('p');summary.textContent=record.pending.length+' recortes pendentes';p.textContent=record.pending.map(item=>item.name).join(', ')+'. A ferramenta de imagem não concluiu esses recortes; as artes originais continuam disponíveis no Digibank.';details.append(summary,p);coverage.append(details);}
}catch{}
</script>
</html>
