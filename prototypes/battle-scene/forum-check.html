<!doctype html><meta charset="utf-8"><title>Forum import checks</title><pre id="results">Testing public sheet parsers…</pre><script type="module">import {parsePublicSheet} from './forum-import.mjs';const list=await (await fetch('/api/forum/sheets')).json();const results=[];for(const sheet of list.sheets){try{const data=await (await fetch('/api/forum/sheet?path='+encodeURIComponent(sheet.path))).json();if(data.error)throw Error(data.error);const s=parsePublicSheet(data.html,{url:data.url,title:data.title});results.push({title:sheet.title,ok:true,name:s.human.name,digimon:s.forms.rookie.name,forms:Object.values(s.forms).map(f=>f.name),warnings:s.warnings});}catch(e){results.push({title:sheet.title,ok:false,error:e.message});}document.querySelector('#results').textContent=JSON.stringify(results,null,2);}document.title='Complete: '+results.filter(r=>r.ok).length+'/'+results.length;</script>
