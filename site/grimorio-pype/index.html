<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O grimório de Pype Ervafina</title><link rel="stylesheet" href="styles.css"><script defer src="data.js"></script><script defer src="art.js"></script><script defer src="livro.js?v=epigrafe-2"></script><script defer src="app.js?v=epigrafe-2"></script></head>
<body><header class="toolbar"><a class="brand" href="#" id="home">✧ <span>O ARQUIVO DAS IMPROBABILIDADES</span></a><div><span id="save-status" role="status">Carregando o livro…</span><button id="retry-save" hidden>Tentar salvar</button><button id="export" title="Salvar cópia de segurança em JSON">Exportar</button><button id="import">Importar</button><button id="close-book">Fechar livro</button><input id="import-file" type="file" accept="application/json" hidden></div></header>
<main class="reading-room">
  <section id="desk" class="is-closed" aria-label="Grimório de Pype">
    <div class="book-wrap">
      <div class="book title-spread" id="book">
        <article class="page left" id="left-page"></article>
        <article class="page right" id="right-page"></article>
        <div class="binding" aria-hidden="true"></div>
        <button class="cover" id="open-book" aria-label="Não abra este grimório"><div class="cover-border"><span class="cover-top">UM TRATADO PARTICULAR</span><div id="cover-art"></div><h2>Observações sobre<br>Incidências Favoráveis,<br>Coincidências e Outras<br>Improbabilidades</h2><span class="cover-rule">✦</span><p>Pype Ervafina</p><small>NÃO ABRA ESTE GRIMÓRIO</small></div><span class="cover-lining" aria-hidden="true"></span></button>
      </div>
    </div>
    <footer class="book-footer">
      <button id="prev" aria-label="Virar para a esquerda">←</button>
      <span id="folio" aria-live="polite"></span>
      <button id="next" aria-label="Virar para a direita">→</button>
    </footer>
  </section>
</main>
<dialog id="editor"><form id="spell-form"><div class="dialog-title"><h2>Transcrever uma magia</h2><button type="button" id="cancel-editor" aria-label="Fechar">×</button></div><div class="form-grid"><label>Nome<input name="name" required maxlength="100"></label><label>Nome original<input name="en" maxlength="100"></label><label>Círculo<input name="level" type="number" min="0" max="9" value="1" required></label><label>Escola<input name="school" value="A definir" required></label><label>Conjuração<input name="time" value="1 ação" required></label><label>Alcance<input name="range" value="18 m / 60 pés" required></label><label>Componentes<input name="components" value="V, S" required></label><label>Duração<input name="duration" value="Instantânea" required></label></div><div class="checks"><label><input type="checkbox" name="ritual"> Ritual</label><label><input type="checkbox" name="concentration"> Concentração</label></div><label>Resumo<textarea name="effect" required></textarea></label><label>Como usar<textarea name="practical" required></textarea></label><button type="submit" class="ink-button">Guardar no grimório</button></form></dialog><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><div id="toast" role="status" aria-live="polite"></div></body></html>
